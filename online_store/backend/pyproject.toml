[project]
name = "online-store-backend"
version = "0.1.0"
description = "Online Store (Uzbekistan) — FastAPI backend, Telegram bot and background worker"
readme = "README.md"
requires-python = ">=3.12,<3.14"
# Direct dependencies are pinned exactly; transitive versions are locked in uv.lock.
dependencies = [
    "fastapi==0.165.0",
    "uvicorn[standard]==0.54.0",
    "sqlalchemy[asyncio]==2.0.58",
    "asyncpg==0.32.0",
    "alembic==1.20.1",
    "pydantic==2.14.4",
    "pydantic-settings==2.16.3",
    "redis[hiredis]==5.3.1",
    "aiogram==3.34.0",
    "arq==0.28.0",
    "pyjwt==2.15.1",
    "argon2-cffi==25.1.0",
    "httpx==0.28.1",
    "python-multipart==0.0.34",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.5.0",
    "ruff==0.17.6",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["app/database/migrations/versions"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "ASYNC", "SIM", "RUF", "N", "C4", "PT"]
ignore = ["RUF001", "RUF002", "RUF003"]  # Uzbek apostrophes (o‘, g‘) are intentional

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
addopts = "-ra --strict-markers"

# Base stack shared by development and production.
#   Development: docker compose up --build          (also loads docker-compose.override.yml)
#   Production:  docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# PostgreSQL and Redis publish no ports here: they are reachable only on the
# internal network. The development override publishes them on 127.0.0.1 only.

name: online-store

x-backend: &backend
  build:
    context: ./backend
    target: runtime
  image: online-store-backend:latest
  env_file: .env
  environment:
    DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    REDIS_URL: redis://redis:6379/0
    API_INTERNAL_URL: http://api:8000
    MEDIA_ROOT: /app/media
  restart: unless-stopped
  networks: [internal]

services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      TZ: UTC
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [internal]

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks: [internal]

  # One-shot: applies Alembic migrations, then exits. api/bot/worker wait for it.
  migrate:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      postgres: { condition: service_healthy }

  api:
    <<: *backend
    volumes:
      - media:/app/media
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/live', timeout=4).status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  bot:
    <<: *backend
    command: ["python", "-m", "app.bot.main"]
    healthcheck:
      disable: true
    depends_on:
      api: { condition: service_healthy }
      redis: { condition: service_healthy }

  worker:
    <<: *backend
    command: ["arq", "app.workers.main.WorkerSettings"]
    healthcheck:
      test: ["CMD", "arq", "--check", "app.workers.main.WorkerSettings"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  frontend:
    build:
      context: ./frontend
      target: runtime
    image: online-store-frontend:latest
    restart: unless-stopped
    networks: [internal]
    depends_on:
      api: { condition: service_healthy }

  nginx:
    image: nginx:1.28-alpine
    ports:
      - "${HTTP_PORT:-80}:8080"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - media:/srv/media:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/nginx-health"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks: [internal]
    depends_on:
      api: { condition: service_healthy }
      frontend: { condition: service_healthy }

volumes:
  postgres_data:
  redis_data:
  media:

networks:
  internal:
